; PlatformIO Project Configuration File for SIP Client
; M5Stack StickC Plus2 - SIP (Session Initiation Protocol) Client
;
; This project implements a SIP client with full audio support
; using the M5Stack StickC Plus2 device

[platformio]
default_envs = m5stack-cplus2-sip

[env:m5stack-cplus2-sip]
platform = espressif32
board = m5stack-cplus2
framework = arduino

; Board configuration
board_build.partitions = default.csv
board_build.f_flash = 40000000L
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=5
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    
    ; M5Stack StickC Plus2 Hardware Configuration
    -DMIC_SPM1423=1              ; SPM1423 I2S Microphone
    -DI2S_MIC_CHANNEL=I2S_CHANNEL_FMT_ONLY_LEFT
    -DI2S_MIC_SERIAL_CLOCK=0
    -DI2S_MIC_LEFT_RIGHT_CLOCK=34
    -DI2S_MIC_SERIAL_DATA=0
    
    ; Speaker Configuration (AW88298)
    -DHAS_SPEAKER=1
    -DBUZZ_PIN=2
    
    ; Display Configuration (ST7789)
    -DHAS_SCREEN=1
    -DUSER_SETUP_LOADED=1
    -DST7789_2_DRIVER=1
    -DTFT_RGB_ORDER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_BACKLIGHT_ON=1
    -DTFT_CS=5
    -DTFT_DC=14
    -DTFT_RST=12
    -DTFT_MOSI=15
    -DTFT_SCLK=13
    -DTFT_BL=27
    -DBACKLIGHT=27
    -DROTATION=3
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    
    ; Button Configuration
    -DHAS_BTN=1
    -DBTN_A=37                   ; Button A (Call/Answer)
    -DBTN_B=39                   ; Button B (Hang Up)
    -DBTN_PWR=35                 ; Power button
    -DBTN_ACT=LOW
    
    ; I2C Configuration (for RTC and other peripherals)
    -DGROVE_SDA=32
    -DGROVE_SCL=33
    -DHAS_RTC=1
    
    ; Battery monitoring
    -DBAT_PIN=38

; Library dependencies
lib_deps =
    ; Core libraries
    m5stack/M5StickCPlus2@^1.0.1
    
    ; Display library
    bodmer/TFT_eSPI@^2.5.43
    
    ; Network libraries
    WiFi
    WiFiClientSecure
    ArduinoJson@^7.0.4
    
    ; Note: Audio is handled natively using ESP32 I2S driver
    ; G.711 codec implemented directly in audio_handler.cpp
    ; RTP protocol implemented directly in audio_handler.cpp
    
    ; Utilities
    NTPClient
    Time

; Monitor configuration
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload configuration
upload_speed = 921600
